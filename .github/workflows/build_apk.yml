name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release / Debug)
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-debug.apk release-output/MindSpace-v2.1-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest-build
          name: "MindSpace Latest Auto-Build"
          body: |
            ## Automated OTA Release Build
            - Triggered by commit `${{ github.sha }}`
            - Direct download link: [MindSpace-v2.1-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest-build/MindSpace-v2.1-debug.apk)
          files: release-output/MindSpace-v2.1-debug.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
